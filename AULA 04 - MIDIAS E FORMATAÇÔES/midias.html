<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inserindo mídias no HTML5</title>
</head>
<body>
    <h1>Inserindo midias no site</h1>
    
    <h2>Imagens:</h2>
    <img src="midias/imagem.jpg" alt="foto de paisagem" width="300px" height="300px">

    <h2>Imagens com legenda:</h2>
    <figure>
        <img src="midias/grafico.png" alt="Gráfico de crescimento anual da empresa" width="300px">
        <figcaption>Gráfico de crescimento da empresa em 2025</figcaption>
    </figure>

    <h2>Áudio:</h2>
    <audio controls>
        <source src="midias/Voicy_hog rider.mp3" type="audio/mpeg">
        Não foi possível reproduzir o áudio.
    </audio>

    <h2>Vídeo:</h2>
    <video controls width="400px">
        <source src="midias/video.mp4">
        Não foi possível reproduzir o vídeo
    </video>

    <h2>Vídeo incorporado do YouTube:</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/PlulyWs1kS4?si=rqG2jJC_xE-taC3G" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Mapas:</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d903.9523723240427!2d-47.94007356172832!3d-25.006588668894366!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2s!5e0!3m2!1spt-BR!2sbr!4v1788217565311!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <h2>incorporando PDFs:</h2>
    <iframe 
    src="midias/documento.pdf"
    title="Horários do DSM-1"
    width="600px
    height450px"
    >
    </iframe>

</body>
</html>
