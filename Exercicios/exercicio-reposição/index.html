
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu primeiro contato com Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-5">

        <!-- Título e descrição -->
        <h1 class="display-4 text-center">
            Bem-vindo ao Bootstrap!
        </h1>

        <p class="lead text-center">
            Esta é minha primeira página usando um framework CSS.
        </p>

        <!-- Botões -->
        <div class="d-flex justify-content-center gap-2 mt-4">
            <button class="btn btn-primary">
                Botão Primário
            </button>

            <button class="btn btn-success">
                Botão Sucesso
            </button>

            <button class="btn btn-danger">
                Botão Perigo
            </button>
        </div>

        <!-- Card -->
        <div class="card mt-5" style="width: 18rem; margin: 0 auto;">
            <div class="card-body">

                <h5 class="card-title">
                    Card de exemplo
                </h5>

                <p class="card-text">
                    Este é um componente card, um dos elementos
                    prontos do Bootstrap.
                </p>

                <a href="#" class="btn btn-outline-primary">
                    Saiba mais
                </a>

            </div>
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
